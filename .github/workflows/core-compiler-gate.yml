name: Core Compiler Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: core-compiler-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-compiler-gate:
    name: self-host, compatibility, and core checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.2

      - name: Record toolchain
        run: |
          set -euo pipefail
          gcc --version
          make --version
          python3 --version
          uname -a

      - name: Install host tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make python3

      - name: Run mandatory compiler gate
        run: |
          set -euo pipefail
          make fortify-ci
          make test
          make check-evm-lifter check-ir-vuln-tag check-copy-const-prop
